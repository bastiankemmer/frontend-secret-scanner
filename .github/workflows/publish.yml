name: Publish to npm and GitHub

# Runs when a version tag is pushed, for example v0.3.0 for version 0.3.0:
#   npm version minor && git push --follow-tags
# Publishes to npm, then creates the GitHub release with the matching section
# of CHANGELOG.md as its notes. Fails before publishing if that section is
# missing or the tag does not match package.json.
#
# No npm token: npm trusted publishing (OIDC). Set it up once on npmjs.com under
# the package's Settings > Trusted publishing: GitHub Actions, user
# bastiankemmer, repo frontend-secret-scanner, workflow publish.yml.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release
  id-token: write # npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Trusted publishing needs npm 11.5.1 or newer, which Node 24 ships.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Tag matches package version
        run: test "v$(node -p "require('./package.json').version")" = "${{ github.ref_name }}"

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## /{ p = ($2 == v); next } p' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section '## $version - <date>' with entries." >&2
            exit 1
          fi
          cat notes.md

      - run: npm ci

      # prepublishOnly runs tests, typecheck, and build again before upload.
      - run: npm publish

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md \
            || gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
